<!DOCTYPE html>
<html>
<head>
<title>Session History</title>
<style>
body{
    font-family:Arial;
    background:#f4f6f9;
    padding:30px;
}
.container{
    width:1100px;
    margin:auto;
}
.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}
table{
    width:100%;
    border-collapse:collapse;
}
th{
    background:#007bff;
    color:white;
}
th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}
a{
    text-decoration:none;
}
.back{
    display:inline-block;
    margin-top:20px;
    background:#6c757d;
    color:white;
    padding:10px 20px;
    border-radius:5px;
}
</style>
</head>
<body>

<div class="container">
<div class="card">
<h2>Attendance Session History</h2>
<table>
<tr>
<th>ID</th>
<th>Date</th>
<th>Subject</th>
<th>Period</th>
<th>Start</th>
<th>End</th>
<th>Status</th>
<th>Action</th>
</tr>
{% for s in sessions %}
<tr>
<td>{{ s[0] }}</td>
<td>{{ s[1] }}</td>
<td>{{ s[2] }}</td>
<td>{{ s[3] }}</td>
<td><span class="utc-time">{{ s[4] }}</span></td>
<td><span class="utc-time">{{ s[5] }}</span></td>
<td>{{ s[6] }}</td>
<td>
<a href="/session/{{ s[0] }}">View</a>
</td>
</tr>
{% endfor %}
</table>
<a href="/" class="back">← Back to Dashboard</a>
</div>
</div>

<script>
    // Convert server UTC time to Local Time
    document.querySelectorAll('.utc-time').forEach(el => {
        let timeStr = el.innerText.trim();
        if(timeStr && timeStr !== 'None' && timeStr !== '-') {
            // Replace space with T and append Z to force JS to read as UTC
            let dateObj = new Date(timeStr.replace(' ', 'T') + 'Z');
            if(!isNaN(dateObj)) {
                el.innerText = dateObj.toLocaleString(); 
            }
        }
    });
</script>

</body>
</html>
