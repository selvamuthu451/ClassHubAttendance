<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Started</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', Arial, sans-serif;
            background: linear-gradient(135deg, #00A0E9 0%, #66c7f4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            border-top: 12px solid #E3001B; /* Collar Red */
            position: relative;
        }

        /* Doraemon Bell */
        .bell {
            width: 45px;
            height: 45px;
            background: #FFD900;
            border-radius: 50%;
            border: 2px solid #333;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .bell::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 3px;
            background: #333;
            top: 12px;
            left: 0;
        }
        .bell::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
        }
        .bell-line {
            position: absolute;
            width: 3px;
            height: 12px;
            background: #333;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
        }

        h1 {
            color: #00A0E9;
            margin-bottom: 20px;
            font-size: 26px;
        }

        .info-box {
            background: #f0f9ff;
            border: 2px dashed #91d5ff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
            color: #444;
            font-size: 16px;
            line-height: 1.6;
        }

        .info-box b {
            color: #0050b3;
        }

        /* Giant Attendance Code Display */
        .code-display {
            background: #FFD900;
            color: #E3001B;
            font-size: 36px;
            font-weight: bold;
            padding: 15px;
            border-radius: 16px;
            letter-spacing: 4px;
            margin: 15px 0 25px 0;
            border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            background: #00A0E9;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0, 160, 233, 0.3);
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .back-btn:hover {
            background: #0088c7;
        }

        .back-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Bell Element -->
            <div class="bell">
                <div class="bell-line"></div>
            </div>

            <h1>Attendance Live!</h1>

            <div class="info-box">
                <p><b>Subject:</b> {{ subject }}</p>
                <p><b>Period:</b> {{ period }}</p>
                <p><b>Duration:</b> {{ duration }} minute(s)</p>
            </div>

            <p style="font-weight: bold; color: #555;">Share this code with your students:</p>
            
            <div class="code-display">
                {{ code }}
            </div>

            <a href="/" class="back-btn">← Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
