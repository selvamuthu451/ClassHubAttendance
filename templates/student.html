<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        /* Warning Marquee Styles */
        .warning-banner {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .moving-text {
            display: inline-block;
            white-space: nowrap;
            font-weight: bold;
            font-size: 15px;
            /* The animation moves the text from right to left */
            animation: scroll-left 15s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Card Styles */
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 26px;
        }

        /* Form Elements */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.2);
        }

        .submit-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #218838;
        }

        /* Response Messages */
        .message-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Moving Warning Note -->
        <div class="warning-banner">
            <div class="moving-text">
                ⚠️ NOTE: If you proxy or are found cheating in attendance, you will be marked absent for the next 5 classes! ⚠️
            </div>
        </div>

        <!-- Attendance Form Card -->
        <div class="card">
            <h1>Student Attendance</h1>
            
            <form method="POST">
                <div class="form-group">
                    <label>Register Number</label>
                    <input type="text" name="register_number" placeholder="Enter your register number" required>
                </div>

                <div class="form-group">
                    <label>Attendance Code</label>
                    <input type="text" name="attendance_code" placeholder="Enter 8-digit code" required autocomplete="off">
                </div>

                <input type="submit" value="Submit Attendance" class="submit-btn">
            </form>

            <!-- Server Response Message -->
            {% if message %}
                <div class="message-box {% if 'Successfully' in message %}success{% else %}error{% endif %}">
                    {{ message }}
                </div>
            {% endif %}
        </div>

    </div>

</body>
</html>
