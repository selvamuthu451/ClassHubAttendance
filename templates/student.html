<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', Arial, sans-serif;
            background: linear-gradient(135deg, #00A0E9 0%, #66c7f4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        /* Themed Warning Marquee */
        .warning-banner {
            background-color: #FFD900; /* Bell Yellow */
            color: #E3001B; /* Collar Red */
            border: 2px solid #E3001B;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .moving-text {
            display: inline-block;
            white-space: nowrap;
            font-weight: bold;
            font-size: 15px;
            animation: scroll-left 15s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Card Styles */
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            border-top: 12px solid #E3001B;
            position: relative;
        }

        .bell {
            width: 45px;
            height: 45px;
            background: #FFD900;
            border-radius: 50%;
            border: 2px solid #333;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .bell::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 3px;
            background: #333;
            top: 12px;
            left: 0;
        }
        .bell::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
        }
        .bell-line {
            position: absolute;
            width: 3px;
            height: 12px;
            background: #333;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
        }

        .card h1 {
            color: #00A0E9;
            margin-bottom: 30px;
            font-size: 26px;
        }

        /* Form Elements */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #00A0E9;
            box-shadow: 0 0 8px rgba(0, 160, 233, 0.3);
        }

        /* Submit Button */
        .submit-btn {
            background: #00A0E9;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            transition: all 0.3s;
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: 0 4px 6px rgba(0, 160, 233, 0.3);
        }

        .submit-btn.enabled {
            opacity: 1;
            cursor: pointer;
        }

        .submit-btn.enabled:hover {
            background: #0088c7;
        }
        
        .submit-btn.enabled:active {
            transform: scale(0.98);
        }

        /* Response Messages */
        .message-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
        }

        .success {
            background-color: #e6f7ff;
            color: #0050b3;
            border: 2px solid #91d5ff;
        }

        .error {
            background-color: #fff1f0;
            color: #E3001B;
            border: 2px solid #ffa39e;
        }

        .location-status {
            font-size: 14px;
            font-weight: bold;
            margin-top: -10px;
            margin-bottom: 20px;
            color: #00A0E9;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Moving Warning Note -->
        <div class="warning-banner">
            <div class="moving-text">
                ⚠️ NOTE: If you proxy or are found cheating in attendance, you will be marked absent for the next 5 classes! ⚠️
            </div>
        </div>

        <!-- Attendance Form Card -->
        <div class="card">
            <!-- Decorative Bell -->
            <div class="bell">
                <div class="bell-line"></div>
            </div>

            <h1>Student Attendance</h1>
            
            <form method="POST">
                <div class="form-group">
                    <label>Register Number</label>
                    <input type="text" name="register_number" placeholder="Enter your register number" required>
                </div>

                <div class="form-group">
                    <label>Attendance Code</label>
                    <input type="text" name="attendance_code" placeholder="Enter 8-digit code" required autocomplete="off">
                </div>
                
                <!-- Geolocation Status Display -->
                <div id="locationStatus" class="location-status">
                    📍 Requesting location access...
                </div>

                <!-- Button is disabled until location is verified -->
                <input type="submit" id="submitBtn" value="Submit Attendance" class="submit-btn" disabled>
            </form>

            <!-- Server Response Message -->
            {% if message %}
                <div class="message-box {% if 'Successfully' in message %}success{% else %}error{% endif %}">
                    {{ message }}
                </div>
            {% endif %}
        </div>

    </div>

    <script>
        // Target Coordinates (Update these if you have a new specific location pin)
        const TARGET_LAT = 10.9602; 
        const TARGET_LNG = 79.3861; 
        const ALLOWED_RADIUS = 100; // Strict 100-meter radius

        const submitBtn = document.getElementById('submitBtn');
        const locationStatus = document.getElementById('locationStatus');

        // Haversine formula to calculate distance between two coordinates in meters
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const radLat1 = lat1 * Math.PI / 180;
            const radLat2 = lat2 * Math.PI / 180;
            const deltaLat = (lat2 - lat1) * Math.PI / 180;
            const deltaLon = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaLat/2) * Math.sin(deltaLat/2) +
                      Math.cos(radLat1) * Math.cos(radLat2) *
                      Math.sin(deltaLon/2) * Math.sin(deltaLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        // Check if browser supports geolocation
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    const distance = calculateDistance(userLat, userLng, TARGET_LAT, TARGET_LNG);

                    if (distance <= ALLOWED_RADIUS) {
                        locationStatus.innerHTML = "✅ Campus location verified!";
                        locationStatus.style.color = "#00A0E9";
                        submitBtn.disabled = false;
                        submitBtn.classList.add("enabled");
                    } else {
                        locationStatus.innerHTML = `❌ You must be on campus to submit. (${Math.round(distance)} meters away)`;
                        locationStatus.style.color = "#E3001B";
                    }
                },
                (error) => {
                    locationStatus.innerHTML = "❌ Location access denied. You must allow GPS access to submit attendance.";
                    locationStatus.style.color = "#E3001B";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            locationStatus.innerHTML = "❌ GPS is not supported by your browser.";
            locationStatus.style.color = "#E3001B";
        }
    </script>
</body>
</html>
